# Pairwise comparison of two generated implementations.
#
# E(T, C, X, R) -> (Y, E, F) with
#   T = pairwise, C = {functional_correctness, readability},
#   X = (gen_a, gen_b), R = canonical_solution (optional),
#   Y = best_choice, E = explanation, F = none.
#
# Run offline first (no API key, deterministic):
#   giuriallm run examples/code-gen-pairwise.yaml --provider mock
name: code-gen-pairwise

judge:
  type: pairwise                 # T
  criteria:                      # C
    - name: functional_correctness
      definition: "Does the code produce the expected output for the task description,
        including on edge cases such as empty input?"
      scale:
        kind: likert
        min: 1
        max: 5
        anchors:
          "1": "Fails the stated task on ordinary input."
          "3": "Handles ordinary input but mishandles an edge case."
          "5": "Correct on ordinary input and on the edge cases implied by the task."
    - name: readability
      definition: "Would a maintainer unfamiliar with the code understand it without
        needing to run it?"
      scale:
        kind: likert
        min: 1
        max: 5
  reference: {mode: optional}    # R
  outputs:                       # Y, E, F
    result: best_choice
    explanation: true
    feedback: false

model:
  provider: anthropic
  id: claude-opus-5
  temperature: 0.0
  samples: 3                     # self-consistency
  thinking: disabled
  max_tokens: 2048

prompt:
  strategy: cot
  order: explain_then_rate

debias:
  position_swap: true            # judge (a,b) and (b,a)
  report_flip_rate: true

evidence:
  - name: python_syntax          # static; nothing is executed

dataset:
  path: data/code-gen.jsonl
  fields:
    id: id
    context: prompt
    candidates: [gen_a, gen_b]
    reference: canonical_solution

meta_evaluation:
  human_labels: data/code-gen-human.jsonl
  metrics:
    - accuracy
    - cohen_kappa
    - krippendorff_alpha
    - earth_movers_distance
    - jensen_shannon
  stratify_by_agreement: true
  agreement_threshold: 0.8

engine:
  concurrency: 8
  cache: true

report:
  output_dir: runs
  formats: [markdown, json, latex]
