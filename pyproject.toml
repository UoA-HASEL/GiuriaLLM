[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "giuriallm"
version = "0.1.0"
description = "A configuration-driven framework for LLM-as-a-Judge evaluation of software artifacts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Yeheng Chen" }, { name = "Valerio Terragni" }]
keywords = ["llm-as-a-judge", "evaluation", "software-engineering", "meta-evaluation"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Quality Assurance",
]

# Deliberately small. The agreement metrics are implemented in pure Python
# rather than pulled from a numerical stack, so a reviewer can install and run
# the tool without a scientific toolchain.
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "anthropic>=0.40",
  "openai>=1.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5"]
validation = ["pandas", "pyarrow"]

[project.scripts]
giuriallm = "giuriallm.cli:main"

[project.urls]
Repository = "https://github.com/UoA-HASEL/GiuriaLLM"
Issues = "https://github.com/UoA-HASEL/GiuriaLLM/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/giuriallm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
  "B008",
  # str-mixin enums are deliberate: every enum here is serialised to YAML/JSON
  # and compared against config strings, and `.value` is used explicitly
  # throughout. StrEnum would change str() semantics for no benefit.
  "UP042",
]
